name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m pytest
        env:
          # conftest.py fournit sa propre clé, celle-ci évite que Settings
          # refuse de démarrer si un test importe l'app avant le conftest.
          SECRET_KEY: ci-only-secret-key-with-at-least-32-chars

  frontend:
    name: Frontend — tsc + eslint + next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # `next build` prérend les pages publiques et échoue si l'API ne
      # répond pas : on démarre un backend jetable sur SQLite pour le build.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint

      - name: Démarrer un backend jetable (SQLite)
        working-directory: backend
        env:
          SECRET_KEY: ci-only-secret-key-with-at-least-32-chars
          DATABASE_URL: sqlite:///./ci.db
          DEBUG: "False"
          CORS_ORIGINS: '["http://localhost:3000"]'
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 1
          done
          echo "Le backend n'a pas démarré :" && cat uvicorn.log && exit 1

      - run: npx next build
